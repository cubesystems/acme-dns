[package]
name = "acme-dns"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "A small HTTP API for per-client Cloudflare DNS-01 TXT upserts"

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
