image:
  repository: cubesystems/acme-dns
  tag: "" # Defaults to Chart.appVersion.
  digest: "" # Optional sha256 digest; takes precedence over tag.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

cloudflare:
  existingSecret: ""
  secretKey: CF_DNS_API_TOKEN

config:
  # Alternatively, reference a ConfigMap containing a clients.json key.
  existingConfigMap: ""
  zoneId: ""
  zoneName: ""
  clients: []

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

podAnnotations: {}
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
