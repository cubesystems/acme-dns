{{- range $name, $secret := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "acme-dns-client.labels" $ | nindent 4 }}
type: {{ default "Opaque" $secret.type | quote }}
data:
  {{- range $key, $value := $secret.data }}
  {{- if not (kindIs "string" $value) }}
  {{- fail (printf "secrets.%s.data.%s must be a string" $name $key) }}
  {{- end }}
  {{- if hasPrefix "HELM_SECRET:" $value }}
  {{- fail (printf "secrets.%s.data.%s must be decrypted by k8s-tools before rendering" $name $key) }}
  {{- end }}
  {{ $key | quote }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
