name: Publish Helm repository

on:
  push:
    branches: [master]
    paths:
      - index.yaml
      - packages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare Helm repository
        run: |
          mkdir -p "$RUNNER_TEMP/helm-repository/packages"
          cp index.yaml "$RUNNER_TEMP/helm-repository/"
          cp packages/*.tgz "$RUNNER_TEMP/helm-repository/packages/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/helm-repository

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
