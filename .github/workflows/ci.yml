name: CI and release

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check image release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tests/release_version.py "$GITHUB_REF_NAME"
      - name: Build and smoke-test container
        run: |
          docker build --tag acme-dns:ci .
          python3 tests/container_smoke.py acme-dns:ci

  chart:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0
      - name: Install chart test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/chart-tests"
          "$RUNNER_TEMP/chart-tests/bin/python" -m pip install PyYAML==6.0.3
          echo "$RUNNER_TEMP/chart-tests/bin" >> "$GITHUB_PATH"
      - name: Check chart
        run: |
          helm lint charts/acme-dns --strict -f charts/acme-dns/ci/test-values.yaml
          helm lint charts/acme-dns-client --strict -f charts/acme-dns-client/ci/test-values.yaml
          python3 tests/helm_test.py

  publish_image:
    if: github.event_name == 'push'
    needs: [verify, chart]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: docker.io/${{ vars.DOCKERHUB_IMAGE || 'cubesystems/acme-dns' }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
